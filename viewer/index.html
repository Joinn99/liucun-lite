<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: https://*.hdslb.com https://*.biliimg.com; media-src blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>留存 · 静态页面</title><link rel="stylesheet" href="viewer.css"></head><body>
<header class="site-header"><a class="brand lite-wordmark" href="index.html" aria-label="静态页面首页">bilibili</a><nav class="main-nav"><span>首页</span><span>番剧</span><span>直播</span><span>游戏中心</span></nav><div class="site-search"><input id="header-search" placeholder="搜索评论、回复与用户名" aria-label="搜索评论和回复"><button id="header-search-go" aria-label="搜索" data-icon="search"></button></div><button id="archive-info" class="offline-chip" title="工程与导出信息" aria-label="工程与导出信息" data-icon="download"></button></header>
<div class="layout lite-page"><main><div class="title-row"><h1 id="title">从工程编辑器打开预览</h1><button id="title-expand" aria-label="展开标题" data-icon="down"></button></div><div id="stats" class="stats"></div><section class="player" id="player" tabindex="0" aria-label="视频播放器"><video id="video" playsinline preload="metadata"></video><div id="danmaku" aria-hidden="true"></div><div id="video-empty"><div class="empty-play" data-icon="play"></div><label class="primary" for="file">选择本地视频</label><p>视频由你提供，弹幕在这里同步播放</p></div>
<div class="video-controls" aria-label="播放控制"><input id="video-seek" class="video-seek" type="range" min="0" max="1" value="0" step="0.01" aria-label="播放进度"><div class="control-row"><button id="play-toggle" aria-label="播放" title="播放 / 暂停（空格）" data-icon="play"></button><button hidden disabled id="next-part" aria-label="下一个分P" title="下一个分P" data-icon="next"></button><span id="video-time">00:00 / 00:00</span><div class="control-spacer"></div><div class="rate-control"><button id="playback-rate-toggle" aria-expanded="false" aria-controls="playback-rate"><span id="playback-rate-label">倍速</span></button><div id="playback-rate" class="player-popover" hidden><button data-rate="2">2.0×</button><button data-rate="1.5">1.5×</button><button data-rate="1.25">1.25×</button><button data-rate="1">正常</button><button data-rate="0.75">0.75×</button><button data-rate="0.5">0.5×</button></div></div><div class="volume-control"><button id="volume-toggle" aria-label="静音" data-icon="volume"></button><div class="volume-popover"><input id="video-volume" aria-label="音量" type="range" min="0" max="1" step="0.05" value="1"></div></div><button id="pip-toggle" title="画中画" aria-label="画中画" data-icon="pip"></button><button id="wide-toggle" title="宽屏" aria-label="宽屏" aria-pressed="false" data-icon="wide"></button><button id="web-fullscreen-toggle" aria-label="网页全屏" title="网页全屏" aria-pressed="false" data-icon="wide"></button><button id="fullscreen" title="全屏（F）" aria-label="全屏" data-icon="fullscreen"></button></div></div></section>
<div class="player-toolbar bili-dm-toolbar"><span id="dm-watch" class="watch-label">已载入弹幕</span><label class="dm-switch bili-dm-switch" title="显示 / 隐藏弹幕"><input id="dm-enabled" type="checkbox" checked aria-label="显示弹幕"><span data-dm-icon="switch"></span></label>
<div class="dm-settings" id="dm-settings"><button id="dm-settings-toggle" class="bili-dm-settings-button" aria-label="弹幕显示设置" aria-expanded="false" aria-controls="dm-settings-popover" title="弹幕设置"><span data-dm-icon="settings"></span></button>
<div id="dm-settings-popover" class="dm-display-popover" role="dialog" aria-label="弹幕显示设置" hidden><div class="dm-display-main"><div class="dm-filter-title">按类型过滤</div><div class="dm-type-filters"><button data-filter="scrolling" aria-label="屏蔽滚动弹幕" aria-pressed="false"><span data-dm-icon="scroll"></span><span>滚动</span></button><button data-filter="fixed" aria-label="屏蔽固定弹幕" aria-pressed="false"><span data-dm-icon="fixed"></span><span>固定</span></button><button data-filter="colored" aria-label="屏蔽彩色弹幕" aria-pressed="false"><span data-dm-icon="color"></span><span>彩色</span></button><button disabled title="高级弹幕仅保存，不参与本地回放"><span data-dm-icon="advanced"></span><span>高级 ⓘ</span></button></div>
<div class="dm-display-checks"><label><input type="checkbox" data-display="rescale" checked>弹幕随屏幕缩放</label><label><input type="checkbox" data-display="protect">防挡字幕</label><label class="dm-unavailable" title="离线页面不含 B站智能人物遮罩"><input type="checkbox" disabled>智能防挡弹幕</label></div>
<div class="dm-word-actions"><button id="dm-words-toggle" aria-expanded="false">弹幕观看屏蔽词</button><button disabled title="本地页面不连接 B站账号">同步屏蔽列表</button></div><div id="dm-words" hidden><textarea id="dm-words-input" data-display="words" aria-label="弹幕观看屏蔽词，每行一个" placeholder="每行一个屏蔽词" maxlength="5000" rows="3"></textarea></div>
<label class="dm-display-range"><span>显示区域</span><input id="dm-area" data-display="area" aria-label="弹幕显示区域" type="range" min="25" max="100" step="25" value="50"><output id="dm-area-value" for="dm-area">50%</output></label>
<div class="dm-density-row"><span>弹幕密度</span><div role="group" aria-label="弹幕密度"><button data-density="normal" aria-pressed="true">正常</button><button data-density="more" aria-pressed="false">较多</button><button data-density="overlap" aria-pressed="false">重叠</button></div></div>
<label class="dm-display-range"><span>不透明度</span><input id="dm-opacity" data-display="opacity" aria-label="弹幕不透明度" type="range" min="0.1" max="1" step="0.05" value="0.8"><output id="dm-opacity-value" for="dm-opacity">80%</output></label>
<label class="dm-display-range"><span>弹幕字号</span><input id="dm-font-scale" data-display="fontScale" aria-label="弹幕字号" type="range" min="0.5" max="2" step="0.05" value="1"><output id="dm-fontScale-value" for="dm-font-scale">100%</output></label>
<label class="dm-display-range"><span>弹幕速度</span><input id="dm-speed" data-display="speed" aria-label="弹幕速度" type="range" min="0.5" max="1.5" step="0.25" value="1"><output id="dm-speed-value" for="dm-speed">适中</output></label>
<button id="dm-advanced-toggle" class="dm-advanced-toggle" aria-expanded="false" aria-controls="dm-advanced"><span>高级设置</span><span>›</span></button></div>
<div id="dm-advanced" class="dm-display-advanced" hidden><h3>更多弹幕设置</h3><label class="dm-sync-label" title="本地回放始终与视频倍速同步"><input type="checkbox" checked disabled>弹幕速度同步播放倍数</label><div class="dm-font-heading">弹幕字体</div><div class="dm-font-row"><select data-display="font" aria-label="弹幕字体"><option>黑体</option><option>宋体</option><option>新宋体</option><option>仿宋</option><option>微软雅黑</option><option>微软雅黑 Light</option><option>Noto Sans DemiLight</option><option>Noto Sans Regular</option></select><label><input type="checkbox" data-display="bold">粗体</label></div><div class="dm-font-heading">描边类型</div><div class="dm-shadow-row" role="group" aria-label="描边类型"><button data-shadow="heavy" aria-pressed="true">重墨</button><button data-shadow="outline" aria-pressed="false">描边</button><button data-shadow="projection" aria-pressed="false">45°投影</button></div><button id="dm-reset">恢复默认设置</button></div></div></div>
<div class="danmaku-input local-send-placeholder" title="离线页面不发送弹幕"><span class="dm-input-symbol">A</span><span>发个友善的弹幕见证当下</span><span class="dm-etiquette">弹幕礼仪 ›</span><button disabled>发送</button></div></div>
<div class="local-video-tools"><button id="video-material" class="local-file-button">选择 / 更换视频</button><span id="file-name"></span><button id="clear-local-video" hidden>移除视频</button></div><input id="file" type="file" accept="video/*,.mkv" aria-label="选择本地视频"><p id="player-message" role="status" aria-live="polite"></p>
<div class="description-block"><div id="description"></div><button id="description-toggle" hidden aria-expanded="false">展开更多</button></div><div id="tags"></div><section id="comments"><div class="comment-heading"><h2>评论 <span id="comment-count"></span></h2><div class="sort-tabs"><button id="sort-hot" class="selected">最热</button><i></i><button id="sort-new">最新</button></div></div><div class="search-row" id="comment-search-row" hidden><input id="search" type="search" placeholder="搜索评论、回复与用户名…" aria-label="筛选评论和回复"><span id="search-count"></span></div><select id="comment-source" aria-label="评论来源" hidden><option value="">全部来源</option></select><div id="comment-list"></div><div id="pagination"></div></section></main>
<aside><section id="owner"></section><div class="project-cover"><img id="cover" alt="工程封面" loading="lazy"></div><details class="side-panel dm-panel" open><summary>弹幕 <span id="dm-count"></span></summary><div class="dm-file-toolbar"><span>已应用工程偏移</span><span><button id="dm-export-xml">XML</button><button id="dm-export-ass">ASS</button></span></div><input id="dm-search" type="search" placeholder="搜索弹幕" aria-label="搜索弹幕"><div class="dm-head" aria-label="弹幕排序"><button type="button" data-dm-sort="time">时间</button><button type="button" data-dm-sort="content">弹幕内容</button><button type="button" data-dm-sort="source">来源</button></div><div id="dm-list"></div><button id="dm-more">显示更多</button></details></aside></div>
<dialog id="info-dialog"><div class="dialog-heading"><h2>工程信息</h2><button id="close-info" aria-label="关闭工程信息">×</button></div><p id="archive-note"></p><div id="warnings"></div><p>选择本地视频即可在本页面播放已合并并应用偏移的弹幕。视频只在本机读取，不上传，也不会加入工程或 ZIP。弹幕 XML / ASS 仍可供外部播放器使用。</p><div class="info-links"><a href="project.liucun.json" download>工程文件</a><a href="export-report.json" download>导出报告</a></div></dialog><dialog id="lightbox"><button id="close-lightbox" aria-label="关闭大图">×</button><img id="lightbox-img" alt="评论大图"></dialog><footer>留存 · 静态汇总</footer><script src="project-data.js"></script><script src="viewer.js"></script></body></html>
